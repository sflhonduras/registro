name: Mantener el backend despierto (evento 10-19 agosto, 6am-10pm Honduras)

# SOLO corre durante la ventana del evento (10 al 19 de agosto), y dentro de eso, solo entre
# las 6:00 a.m. y las 10:00 p.m. hora de Honduras (UTC-6). Fuera de esas fechas, este archivo
# no hace nada — el backend vuelve a dormirse normal, como siempre.
#
# ⚠️ IMPORTANTE: este horario se repite automáticamente CADA AÑO en estas mismas fechas de
# agosto, a menos que borres o desactives este archivo después del evento. No se apaga solo
# de forma permanente — hay que quitarlo a mano cuando ya no se necesite.
#
# Nota técnica: el rango de días (10-20) incluye un día extra a propósito, para cubrir
# correctamente la noche del 19 de agosto (por la diferencia de horario entre Honduras y UTC,
# que es lo que usa GitHub Actions para programar tareas).
on:
  schedule:
    - cron: '*/14 12-23,0-3 10-20 8 *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visitar el backend para que no se duerma
        run: curl -sf https://sfl-fihnec-api.onrender.com/api/salud || echo "El backend no respondió, pero no es grave — se reintenta en 14 minutos."
